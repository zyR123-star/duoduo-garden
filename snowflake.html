<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#031011" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="多多花园">
<title>雪花 · 多多花园</title>
<meta name="description" content="在飘雪中用手接住一朵雪花，再张开手掌，让六向晶枝在指尖盛开。" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/icon-180.png" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./snowflake.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>
</head>
<body class="snowflake-page">

<div id="stage" class="stage">
  <canvas id="gl-layer" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
</div>

<header class="topbar">
  <a class="brand brand-link" href="./" aria-label="返回多多花园">
    <svg class="brand-back" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M19 12H6M11 6l-6 6 6 6" />
    </svg>
    <span class="brand-cn">雪花</span>
    <span class="brand-sep"></span>
    <span class="brand-en">DUODUO GARDEN · 02</span>
  </a>
  <div class="tools">
    <button class="tool" id="btn-retry" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg>
      <span>重试</span>
    </button>
    <button class="tool" id="btn-reset" type="button" hidden>换一朵</button>
    <button class="tool" id="btn-pip" type="button" aria-pressed="true" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="9" cy="11" r="2" /><path d="M3 17l5-4 4 3 3-2 6 4" /></svg>
      <span>手部</span>
    </button>
  </div>
</header>

<section class="intro" id="intro">
  <div class="intro-glow" aria-hidden="true"></div>
  <div class="intro-inner">
    <p class="kicker">WINTER FLOWER · NO. 02</p>
    <h1>接住一朵<br /><em>雪花</em></h1>
    <p class="lede">
      小雪片正在落下。<br />
      伸出手，接住一朵，再让它慢慢盛开。
    </p>
    <div class="actions">
      <button id="btn-camera" class="btn btn-primary" type="button">开启摄像头</button>
      <button id="btn-demo" class="btn btn-ghost" type="button">先看演示</button>
    </div>
    <p class="fineprint" id="intro-note">画面仅在本机处理，不会上传任何数据</p>
  </div>
</section>

<aside class="hud" id="hud" aria-live="polite">
  <div class="hud-top">
    <span class="hud-dot" id="hud-dot"></span>
    <span class="hud-state" id="state-label">冰晶花苞</span>
    <span class="hud-mode" id="mode-label">准备</span>
  </div>
  <div class="meter"><i id="meter-fill"></i></div>
  <div class="hud-nums">
    <span><em>target</em><b id="num-tension">0.00</b></span>
    <span><em>spread</em><b id="num-spread">0.00</b></span>
  </div>
</aside>

<div class="capture-prompt" id="capture-prompt" aria-live="polite">
  <i></i>
  <div>
    <b id="prompt-title">伸出手</b>
    <span id="prompt-detail">接住一朵飘落的雪花</span>
  </div>
</div>

<div class="capture-reticle" id="capture-reticle" aria-hidden="true"><i></i></div>
<div class="capture-flash" id="capture-flash" aria-hidden="true"></div>

<aside class="pip" id="pip" aria-label="手部捕捉画面">
  <div class="pip-head">
    <i class="pip-dot" id="pip-dot"></i>
    <span class="pip-title">手部捕捉</span>
    <em id="pip-state">等待手部</em>
  </div>
  <div class="pip-body"><canvas id="pip-canvas"></canvas></div>
  <div class="pip-foot">
    <span class="pip-bar"><i id="pip-fill"></i></span>
    <b id="pip-num">0.00</b>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>
<div class="snowflake-index" aria-hidden="true">02</div>

<script type="module" src="./src/pwa.js"></script>
<script type="module" src="./src/snowflakeExperience.js"></script>
</body>
</html>
